<!DOCTYPE html>
<html>
<head>
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .thankyou-box {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h1 {
            color: #A636FE;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background-color: #A636FE;
            color: white;
            padding: 10px 15px;
            border-radius: 4px;
        }

        a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="thankyou-box">
        <h1>Thank you!</h1>
        <p>Loop IT will contact you soon.</p>
        <a href="contactform.html">Back to the form</a>
    </div>

</body>

</html>
