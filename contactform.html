<!DOCTYPE html>
<html>
<head>
  <title>Contact Form</title>
  <meta http-equiv="Content-type" content="text/html; charset=UTF-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }

    .form-container {
      width: 400px;
      margin: 50px auto;
      padding: 25px;
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    input[type="submit"] {
      background-color: #A636FE;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="submit"]:hover {
      opacity: 0.9;
    }

    .required-note {
      font-size: 14px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="form-container">
  <h2>Contact Form</h2>
  <p class="required-note">Fields marked with * are required.</p>

  <form id="w2lForm"
        action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dg5000003OCMU"
        method="POST">

    <input type="hidden" name="oid" value="00Dg5000003OCMU">
    <input type="hidden" name="retURL" value="https://satukaroliina.github.io/thankyou.html">

    <input type="hidden" name="recordType" value="012g5000000ABCDE">
    <input type="hidden" name="lead_source" value="Web">
    <input type="hidden" name="status" value="Open - Not Contacted">

    <label for="first_name">First Name: *</label>
    <input id="first_name" name="first_name" maxlength="40" type="text" required>

    <label for="last_name">Last Name: *</label>
    <input id="last_name" name="last_name" maxlength="80" type="text" required>

    <label for="email">Email: *</label>
    <input id="email" name="email" maxlength="80" type="email" required>

    <label for="mobile">Mobile:</label>
    <input id="mobile" name="mobile" maxlength="40" type="tel">

    <label for="00Ng5000008s4d8">Product Family: *</label>
    <select id="00Ng5000008s4d8" name="00Ng5000008s4d8" required>
      <option value="">--None--</option>
      <option value="Smartphone">Smartphone</option>
      <option value="Laptop">Laptop</option>
    </select>

    <label for="00Ng5000008s6Te">Model: *</label>
    <input id="00Ng5000008s6Te" name="00Ng5000008s6Te" maxlength="255" type="text" required>

    <label for="00Ng500000ANUyv">Product Name: *</label>
    <input id="00Ng500000ANUyv" name="00Ng500000ANUyv" maxlength="255" type="text" required>

    <label for="00Ng5000008s9Mf">Purchase Year: *</label>
    <input id="00Ng5000008s9Mf" name="00Ng5000008s9Mf" type="number" min="2000" max="2026" required>

    <label for="00Ng5000008s9WL">Condition of the product: *</label>
    <select id="00Ng5000008s9WL" name="00Ng5000008s9WL" required>
      <option value="">--None--</option>
      <option value="New">New</option>
      <option value="Good">Good</option>
      <option value="Fair">Fair</option>
      <option value="Broken">Broken</option>
    </select>

    <input type="submit" value="Submit">
  </form>
</div>

</body>
</html>
